; ===========================================================================
; 四路值怎么填 —— 每把枪的「质感」就在这四个数的比例里
;
;   ShotTrigR   右扳机：击发那一下（最直接的那一路）
;   ShotTrigL   左扳机：双手握持的反馈（一般比 RT 小很多，甚至 0）
;   ShotBodyL   左握把：低频后坐、枪身重量（大枪重、小枪轻）
;   ShotBodyR   右握把：高频机械感、枪机/弹壳的清脆
;   ShotEnvMs   总时长（越短越「脆」，越长越「闷」）
;   ShotAttackMs 起振时间 5~15ms（越短越锐利）
;
; 两个全局旋钮（[Haptics] 段）：
;   ShotBodyScale  握把那两路的整体缩放。握把的数字看着小、实际很猛，
;                  默认 0.60；觉得握把太强就往下调。
;   ShotDecayExp   衰减曲线（1.2 是「快起慢落」，越大尾巴越短）
;
; 组级参数在 [Weapon*] 里，是「没单独列出的枪」的兜底 —— 列过的枪优先用上面。
; ===========================================================================
