; ===========================================================================
; [Debug] —— 调试模式
;
; 打开后一次把排查要用的东西备齐：**自动拉起监视窗口和状态窗口**、日志提到
; debug。平时这些都是关着的（发布形态就是要安静），于是排查时经常出现
; 「以为是没数据，其实是窗口压根没开」——这一节就是给那种时刻用的。
;
; 两种打开方式，任选其一：
;   1) 在 ini 同目录放一个**空文件** `gpxinput_debug.on`
;      建文件 = 开，删文件 = 关。最快的开关，不用改配置。
;   2) 把下面的 Mode 改成 true。
; 文件优先：文件在就是开，文件不在才看 ini。
;
; 这些窗口都是独立的控制台进程，崩了、被你关了都不影响手柄链路。
; ===========================================================================

[Debug]

; 调试模式总开关。
Mode=false

; 调试模式下拉起哪些窗口（可执行文件不在就跳过，只记一条日志）：
;   gp_monitor.exe     四电机实时监视（游戏原值 / 最终输出 / 合成状态）
;   gp_state_view.exe  游戏状态（武器组名字 / 动作 / 马速）
Monitor=true
StateView=true

; 调试模式下把日志级别提到 debug（[Proxy] LogLevel 里写得更高就不动它）。
; 排查时最有用的是它：能看到每次开枪判定、通道选择、窗口拉起的结果。
VerboseLog=true

; 工具所在目录。留空 = 游戏目录（代理所在目录）。
; 想保持游戏目录干净，就把工具放到别处，这里写那个目录（末尾加不加斜杠都行）。
ToolDir=



; ===========================================================================
; 具体枪械 —— 每把枪单独一档（优先于上面的武器组）
;
; 哈希 = joaat(武器名)，例如 WEAPON_REPEATER_EVANS = 0x7194721E。
; 这张表是用「游戏里实测到的武器哈希」反查出来的，名字来自游戏自己的
; 模型命名，所以可以直接对着改：想要哪把枪更重，就改它自己的 ShotGain /
; ShotEnvMs / ShotBodyKick。
;
; 匹配顺序：**先查这里（按具体枪），查不到才用上面的武器组**。所以
;   · 没列出来的枪 / DLC 变体 → 自动用组级参数，不会没手感
;   · 想精修某一把 → 只改它这一节
; ===========================================================================



; ===========================================================================
; 具体枪械 —— 每把枪单独一档（优先于上面的武器组）
;
; 哈希 = joaat(武器模型名)。名字来源：**用游戏里实测到的武器哈希反查**得到
; （已验证的：米德奈特=毛瑟、埃文斯、拉栓式步枪…）。
;
; 关于「某某的左轮手枪」这类独特武器：游戏返回的是它**基础型号**的哈希，
; 所以它们和基础枪共用同一档 —— 想单独调，把那一行拆出来另开一节即可。
;
; 匹配顺序：**先查这里（按具体枪），查不到才用上面的武器组**，所以：
;   · 没列出来的枪 → 自动用组级参数，不会没手感
;   · 想精修某一把 → 只改它这一节
;   · 换到某把枪时日志里会打「匹配到的名字」，对不上就是哈希填错了
; ===========================================================================

